[package]
name = "banshu-ai"
description = "Unified LLM API for open-source models and providers (DeepSeek, Z.AI, MiniMax, Moonshot, and any OpenAI/Anthropic-compatible API)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[features]
default = ["rustls"]
rustls = ["reqwest/rustls-tls"]
native-tls = ["reqwest/native-tls"]
schemars = ["dep:schemars"]

[dependencies]
async-stream = "0.3"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
fastrand = "2"
futures-core = "0.3"
futures-util = "0.3"
getrandom = "0.3"
httpdate = "1"
jsonschema = { version = "0.49.2", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
schemars = { version = "0.8", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["time"] }
tokio-util = "0.7"
tracing = "0.1"

[dev-dependencies]
base64 = "0.22"
futures = "0.3"
httpdate = "1"
proptest = "1"
sha2 = "0.10"
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "net",
    "io-util",
    "sync",
    "time",
    "test-util",
] }
wiremock = "0.6"
