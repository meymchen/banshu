name: Verify release package
description: Audit the dependency graph, public API, and generated banshu-ai archive.

runs:
  using: composite
  steps:
    - run: diff -u README.md crates/ai/README.md
      shell: bash
    - run: cargo test -p xtask --test release_package
      shell: bash
    - name: Check dependency licenses
      uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
      with:
        command: check licenses
    - name: Review the public API against 0.9.0
      uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
      with:
        package: banshu-ai
        baseline-version: 0.9.0
        feature-group: all-features
        release-type: major
        rust-toolchain: manual
    - run: cargo publish --dry-run -p banshu-ai --all-features
      shell: bash
    - name: Verify examples and Context fixture from the package
      run: cargo run -p xtask -- verify-release-package
      shell: bash
