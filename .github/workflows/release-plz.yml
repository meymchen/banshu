name: Release-plz

on:
  push:
    branches:
      - main

jobs:
  # Mirror the checks that make the published package safe to consume. Keeping
  # this gate in the release workflow prevents publication from racing CI.
  pre-release:
    name: Pre-release checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: diff -u README.md crates/ai/README.md
      - run: cargo test -p xtask --test release_package
      - name: Check dependency licenses
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses
      - name: Review the public API against 0.9.0
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: banshu-ai
          baseline-version: 0.9.0
          feature-group: all-features
          release-type: minor
          rust-toolchain: manual
      - run: cargo publish --dry-run -p banshu-ai --all-features
      - name: Verify examples and Context fixture from the package
        run: cargo test --manifest-path target/package/banshu-ai-1.0.0/Cargo.toml --all-features

  # Publish unreleased packages and create git tags / GitHub releases.
  release-plz-release:
    name: Release-plz release
    needs: pre-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # Open/update a release PR with version bumps and changelog.
  release-plz-pr:
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
